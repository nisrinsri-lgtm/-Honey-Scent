<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า — Honey Scent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="brand-logo">Honey Scent</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">หน้าแรก</a></li>
          <li><a href="product.html">สินค้าทั้งหมด</a></li>
          <li><a href="order.html">สั่งซื้อสินค้า</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Order Form Section -->
  <section class="section">
    <div class="container" style="max-width: 620px;">
      <div class="section-header" style="margin-bottom: 48px;">
        <span class="section-eyebrow">Order Placement</span>
        <h1 class="section-title">ยืนยันคำสั่งซื้อ</h1>
        <p class="section-subtitle">
          ตรวจสอบรายการสินค้าและกรอกข้อมูลผู้รับ เพื่อให้ทีมงานจัดเตรียมน้ำผึ้งแท้ส่งตรงถึงมือคุณ
        </p>
      </div>

      <div style="background-color: var(--bg-surface); border: 1px solid var(--border-light); padding: 48px 40px;">
        <form id="orderForm">
          <div class="form-group">
            <label for="customerName" class="form-label">ชื่อลูกค้า *</label>
            <input type="text" id="customerName" class="form-control" placeholder="ระบุชื่อ - นามสกุล" required>
          </div>

          <div class="form-group">
            <label for="contact" class="form-label">เบอร์โทร / Line ID *</label>
            <input type="text" id="contact" class="form-control" placeholder="เช่น 081-234-5678 หรือ Line: @yourid" required>
          </div>

          <div class="form-group">
            <label for="items" class="form-label">รายการสินค้า *</label>
            <input type="text" id="items" class="form-control" placeholder="ระบุชื่อสินค้าและจำนวน" required>
          </div>

          <div class="form-group">
            <label for="total" class="form-label">จำนวนเงินรวม (บาท) *</label>
            <input type="number" id="total" class="form-control" placeholder="0" required>
          </div>

          <div class="form-group" style="margin-bottom: 36px;">
            <label for="note" class="form-label">หมายเหตุ / ที่อยู่จัดส่ง</label>
            <textarea id="note" class="form-control" rows="3" placeholder="ที่อยู่สำหรับจัดส่ง หรือข้อความเพิ่มเติม (ถ้ามี)"></textarea>
          </div>

          <button type="submit" class="btn btn-solid" style="width: 100%;">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-brand">Honey Scent</div>
      <p class="section-subtitle">น้ำผึ้งแท้คัดพิเศษจาก 4 แหล่งดอกไม้ธรรมชาติ</p>
      <p class="footer-copy">&copy; 2026 Honey Scent. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
